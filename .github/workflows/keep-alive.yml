name: Mantener API de Render despierta
# Render free duerme tras 15 min sin trafico y tarda ~50s en despertar
# (la primera visita falla). Este ping cada 10 min lo mantiene activo.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping a la API de EducaFix
        run: |
          code=$(curl -sS -m 60 -o /dev/null -w "%{http_code}" https://educafix.onrender.com/api/config || echo 000)
          echo "Respuesta: $code"
          if [ "$code" != "200" ]; then
            echo "::warning::La API no respondio 200 (puede estar desplegando)"
          fi
